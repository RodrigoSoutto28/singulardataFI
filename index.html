    <style>
      #sdf-splash {
        position: fixed; inset: 0;
        background: #0b0f17;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 8px; z-index: 9999;
        font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.3s ease;
      }
      #sdf-splash.sdf-hide { opacity: 0; pointer-events: none; }
      .sdf-brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
      }
      .sdf-mind {
        color: #e6eef5;
        letter-spacing: -0.02em;
      }
      .sdf-power-icon {
        width: 23px;
        height: 23px;
      }
      .sdf-n {
        color: #C9A88A;
        letter-spacing: -0.02em;
      }
      .sdf-tag {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #A6845F;
        margin-top: 4px;
        padding-left: 2px;
      }
      .sdf-spinner {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid rgba(201, 168, 138, 0.15);
        border-top-color: #C9A88A;
        animation: sdf-spin 0.8s linear infinite;
        margin-top: 16px;
      }
      @keyframes sdf-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #sdf-splash { background: #f7fafc; }
        .sdf-mind { color: #0b0f17; }
      }
    </style>
    <meta property="og:title" content="Mind On — Diario de Trading con IA">

  <body>
    <div id="sdf-splash" aria-hidden="true">
      <div class="sdf-brand">
        <span class="sdf-mind">Mind</span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="#C9A88A"
          stroke-width="3.5"
          stroke-linecap="round"
          class="sdf-power-icon shrink-0"
        >
          <path d="M 18.36 5.64 A 9 9 0 1 1 5.64 5.64" />
          <line x1="12" y1="2" x2="12" y2="12" />
        </svg>
        <span class="sdf-n">n</span>
      </div>
      <div class="sdf-tag">Trading Software</div>
      <div class="sdf-spinner" aria-label="Cargando"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('sdf-splash');
          if (el) {
            el.classList.add('sdf-hide');
            setTimeout(function () { el && el.remove(); }, 350);
          }
        }, 200);
      });
    </script>
  </body>
