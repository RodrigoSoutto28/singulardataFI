  <head>

    <meta name="description" content="El diario de trading más completo en español. Registrá, analizá y mejorá tu rendimiento con IA. Compatible con cTrader, MT4, MT5 y TradingView.">

    <link rel="canonical" href="https://mindon.lovable.app" />

    <!-- Preconnect to font origins to shorten the critical request chain -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    
    
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/attachments/og-images/22d8bca8-a0ab-45ff-8e26-1aaeacd57d7c">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mindontrading" />
    
    
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/attachments/og-images/22d8bca8-a0ab-45ff-8e26-1aaeacd57d7c">

    <style>
      /* Splash screen — pure CSS, no JS deps */
      #sdf-splash {
        position: fixed;
        inset: 0;
        background: #161e2c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        color: #f1e8dc;
        transition: opacity 0.3s ease;
      }
      #sdf-splash.sdf-hide { opacity: 0; pointer-events: none; }
      .sdf-logo {
        width: 56px; height: 56px; border-radius: 12px;
        background: #C9A88A;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(201,168,138,0.35);
      }
      .sdf-logo svg { width: 32px; height: 32px; color: #161e2c; }
      .sdf-name { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; }
      .sdf-tag { font-size: 12px; opacity: 0.7; letter-spacing: 0.18em; text-transform: uppercase; }
      .sdf-spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(217,190,159,0.2);
        border-top-color: #D9BE9F;
        animation: sdf-spin 0.8s linear infinite;
        margin-top: 6px;
      }
      @keyframes sdf-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #sdf-splash { background: #f4eee5; color: #1a2230; }
        .sdf-logo svg { color: #fff; }
      }
    </style>
    
  
  
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta property="og:title" content="MindOn — Diario de Trading con IA">
  <meta name="twitter:title" content="MindOn — Diario de Trading con IA">
  <meta property="og:description" content="El diario de trading más completo en español. Registrá, analizá y mejorá tu rendimiento con IA. Compatible con cTrader, MT4, MT5 y TradingView.">
  
</head>
  <body>
    <div id="sdf-splash" aria-hidden="true">
      <div class="sdf-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
      </div>
      <div class="sdf-name">MindOn</div>
      <div class="sdf-tag">Trading Software</div>
      <div class="sdf-spinner" aria-label="Cargando"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('sdf-splash');
          if (el) {
            el.classList.add('sdf-hide');
            setTimeout(function () { el && el.remove(); }, 350);
          }
        }, 200);
      });
    </script>
  </body>
</html>
