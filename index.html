    <style>
      #sdf-splash {
        position: fixed; inset: 0;
        background: #0b0f17;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 16px; z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        color: #e6eef5;
        transition: opacity 0.3s ease;
      }
      #sdf-splash.sdf-hide { opacity: 0; pointer-events: none; }
      .sdf-logo {
        width: 56px; height: 56px; border-radius: 12px;
        background: #429EBD;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 24px rgba(66,158,189,0.35);
      }
      .sdf-logo svg { width: 32px; height: 32px; color: #0b0f17; }
      .sdf-name { font-size: 18px; font-weight: 700; letter-spacing: 0.4px; }
      .sdf-tag { font-size: 12px; opacity: 0.7; letter-spacing: 0.18em; text-transform: uppercase; }
      .sdf-spinner {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid rgba(95,226,245,0.2);
        border-top-color: #5FE2F5;
        animation: sdf-spin 0.8s linear infinite;
        margin-top: 6px;
      }
      @keyframes sdf-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #sdf-splash { background: #f7fafc; color: #0b0f17; }
        .sdf-logo svg { color: #fff; }
      }
    </style>

    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('sdf-splash');
          if (el) {
            el.classList.add('sdf-hide');
            setTimeout(function () { el && el.remove(); }, 350);
          }
        }, 200);
      });
    </script>
